name: Engine

# Runs the game on demand from the site's console.
#
# Everything that changes game state on main happens here or in a Claude Code
# session — never by hand, never by editing hoc.db. The console dispatches this
# workflow through the GitHub API with the director's own token; the workflow
# does the work, runs the tests, exports the site and commits the result.
#
# No model is called anywhere in this workflow. The console's Narrate control
# produces a block of text for a human to paste into a Claude Code session, and
# that is the whole of Claude's involvement in the running game.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to do"
        required: true
        type: choice
        default: run
        options: [run, intervene, rules, rebuild]
      seasons:
        description: "How many seasons to play (run only)"
        required: false
        type: string
        default: "10"
      stop_on:
        description: "Comma list: removal, challenge, major, marquis, partition, extinction"
        required: false
        type: string
        default: ""
      payload:
        description: "JSON — the turn file for intervene, the patch for rules"
        required: false
        type: string
        default: ""
      note:
        description: "Why. Recorded in the commit message."
        required: false
        type: string
        default: ""
  # A second way in, for a fine-grained PAT that has Contents read/write but
  # was not granted Actions read/write: GitHub rejects workflow_dispatch from
  # such a token with a 403 ("Resource not accessible by personal access
  # token") even though the same token can create a repository_dispatch.
  # Same job, same commands — see "Normalize inputs" below, which is what
  # lets every later step ignore which of the two events fired.
  repository_dispatch:
    types: [engine]

# One run at a time, and never cancel one in flight: a cancelled run could leave
# the season logs written and the database uncommitted.
concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Only the director may run the engine
        # github.actor is the acting user for both events — the person who
        # clicked Run workflow, or the owner of the PAT that sent the
        # repository_dispatch — so one guard covers both trigger paths.
        if: github.actor != 'mdiamond95'
        run: |
          echo "::error::${{ github.actor }} is not the director; this workflow only runs for mdiamond95."
          {
            echo "## Engine — refused"
            echo
            echo "\`${{ github.actor }}\` is not the director. This workflow changes the"
            echo "game state on \`main\`, so it runs only for the repository's owner."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # workflow_dispatch inputs live at github.event.inputs.*; repository_dispatch
      # carries the same fields at github.event.client_payload.* instead (the
      # console sends the same shape either way — see hoc/export/site.py). Every
      # step after this one reads steps.in.outputs.* and never looks at either
      # event's own fields directly, so the two triggers stay interchangeable.
      - name: Normalize inputs
        id: in
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_COMMAND: ${{ github.event.inputs.command }}
          WD_SEASONS: ${{ github.event.inputs.seasons }}
          WD_STOP_ON: ${{ github.event.inputs.stop_on }}
          WD_PAYLOAD: ${{ github.event.inputs.payload }}
          WD_NOTE: ${{ github.event.inputs.note }}
          RD_COMMAND: ${{ github.event.client_payload.command }}
          RD_SEASONS: ${{ github.event.client_payload.seasons }}
          RD_STOP_ON: ${{ github.event.client_payload.stop_on }}
          RD_PAYLOAD: ${{ github.event.client_payload.payload }}
          RD_NOTE: ${{ github.event.client_payload.note }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            command="$RD_COMMAND"; seasons="$RD_SEASONS"; stop_on="$RD_STOP_ON"; payload="$RD_PAYLOAD"; note="$RD_NOTE"
          else
            command="$WD_COMMAND"; seasons="$WD_SEASONS"; stop_on="$WD_STOP_ON"; payload="$WD_PAYLOAD"; note="$WD_NOTE"
          fi
          seasons="${seasons:-10}"
          {
            echo "command=$command"
            echo "seasons=$seasons"
            echo "stop_on=$stop_on"
            echo "note=$note"
          } >> "$GITHUB_OUTPUT"
          {
            echo "payload<<ENGINE_PAYLOAD_EOF"
            printf '%s' "$payload"
            echo
            echo "ENGINE_PAYLOAD_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ubuntu-latest ships node already, but the suite's JS-syntax tests
      # (tests/test_js_syntax.py) depend on `node --check` existing, so it is
      # pinned explicitly rather than left to whatever the runner image
      # happens to preinstall.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-engine.txt

      - name: run — play seasons
        if: steps.in.outputs.command == 'run'
        run: |
          python scripts/engine_command.py run \
            --seasons "${{ steps.in.outputs.seasons }}" \
            --stop-on "${{ steps.in.outputs.stop_on }}" \
            --note "${{ steps.in.outputs.note }}" | tee engine-output.txt

      - name: intervene — apply a director's turn
        if: steps.in.outputs.command == 'intervene'
        env:
          PAYLOAD: ${{ steps.in.outputs.payload }}
        run: |
          python scripts/engine_command.py intervene \
            --payload "$PAYLOAD" \
            --note "${{ steps.in.outputs.note }}" | tee engine-output.txt

      - name: rules — tune a table
        if: steps.in.outputs.command == 'rules'
        env:
          PAYLOAD: ${{ steps.in.outputs.payload }}
        run: |
          python scripts/engine_command.py rules \
            --payload "$PAYLOAD" \
            --note "${{ steps.in.outputs.note }}" | tee engine-output.txt

      - name: rebuild — verify the database reproduces from the record
        if: steps.in.outputs.command == 'rebuild'
        run: |
          python scripts/engine_command.py rebuild \
            --note "${{ steps.in.outputs.note }}" | tee engine-output.txt

      # The 300-season smoke run belongs in a Code session, not here: it takes
      # longer than everything else in this workflow put together, and it tests
      # the rules rather than this run. `build` is excluded the same way: those
      # tests need a build-time-only dependency (shapely) that this runner
      # deliberately does not install, since only a Code session ever rebuilds
      # reference geometry (see pytest.ini).
      - name: Test
        run: |
          set +e
          python -m pytest -q -m "not smoke and not build" --tb=short -rf 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          set -e

          passed="$(grep -oP '\d+(?= passed)' pytest-output.txt | tail -1)"
          failed="$(grep -oP '\d+(?= failed)' pytest-output.txt | tail -1)"
          passed="${passed:-0}"
          failed="${failed:-0}"

          if [ "$status" -ne 0 ]; then
            {
              echo "Tests: ${passed} passed, ${failed} failed"
              echo
              echo "<details><summary>Last 60 lines of pytest output</summary>"
              echo
              echo '```'
              tail -n 60 pytest-output.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tests: ${passed} passed, ${failed} failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$status"

      - name: Export
        run: python -m hoc export

      - name: Commit and push
        run: |
          message="$(sed -n 's/^COMMIT_MESSAGE //p' engine-output.txt | tail -1)"
          if [ -z "$message" ]; then
            echo "::error::the command produced no commit message"
            exit 1
          fi

          git config user.name "House of Cards Engine"
          git config user.email "actions@github.com"
          git add hoc.db scenarios rules outputs narratives

          if git diff --cached --quiet; then
            echo "nothing changed; not committing"
            echo "_Nothing changed, so nothing was committed._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "$message"
          git push origin HEAD:main
          echo "Committed \`$message\`" >> "$GITHUB_STEP_SUMMARY"
