[pytest]
testpaths = tests
markers =
    smoke: plays whole worlds (the 300-season sanity run); minutes, not seconds.
        Excluded from the engine workflow with -m "not smoke and not build" —
        it tests the rules rather than any one run, and belongs in a Code
        session.
    build: needs a build-time-only dependency (shapely, pyshp, topojson) that
        requirements-engine.txt deliberately omits, because the engine
        workflow's runner never rebuilds reference geometry — only a Code
        session does, via scripts/build_*.py. Excluded from the engine
        workflow with -m "not smoke and not build". Every module marked this
        way also calls pytest.importorskip on its build-only import, so a
        missing dependency is a clean skip rather than a collection error
        that would abort the whole run before marker-based deselection ever
        gets a chance to apply.
